name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download llama.cpp engine
        run: node scripts/fetch-engine.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach demo video
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          cp docs/demo.mp4 PULSAR-demo.mp4 && gh release upload "v$V" PULSAR-demo.mp4 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check every script
        shell: bash
        run: for f in main.js preload.js ui/*.js scripts/*.js build/*.js; do node --check "$f" || exit 1; done
      - name: Smoke test
        run: node scripts/smoke.js
      - name: Download llama.cpp engine
        run: node scripts/fetch-engine.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach demo video
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          cp docs/demo.mp4 PULSAR-demo.mp4 && gh release upload "v$V" PULSAR-demo.mp4 --clobber
          [ -f build/release-notes.md ] && gh release edit "v$V" --notes-file build/release-notes.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

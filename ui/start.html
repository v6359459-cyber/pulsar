<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Новая вкладка</title>
<style>
@font-face{font-family:Geist;src:url(fonts/Geist-Variable.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;height:100%;background:#1c1b19;color:#f6f4f0;font-family:Geist,system-ui,sans-serif;font-weight:300}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.logo{font-size:13px;letter-spacing:.5em;font-weight:400;color:#a09b91;animation:f .9s cubic-bezier(.2,.8,.2,1) both}
form{width:min(520px,82vw);animation:f .9s cubic-bezier(.2,.8,.2,1) .1s both}
input{width:100%;box-sizing:border-box;height:52px;border-radius:26px;border:1px solid #312f2b;background:#232220;color:#f6f4f0;padding:0 22px;font:inherit;font-size:16px;outline:none;transition:border-color .25s}
input:focus{border-color:#565249}
@keyframes f{0%{opacity:0;transform:translateY(12px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
</style></head>
<body><div class="logo">PULSAR</div>
<form id="f"><input id="q" placeholder="Поиск или адрес сайта" autofocus></form>
<script>
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();let v=document.getElementById('q').value.trim();if(!v)return;
location.href=/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)?'https://'+v:/^https?:\/\//.test(v)?v:'https://duckduckgo.com/?q='+encodeURIComponent(v);});
</script></body></html>
